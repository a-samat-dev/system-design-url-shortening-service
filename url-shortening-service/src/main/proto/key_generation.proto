syntax = "proto3";

package kz.astana.url_shortener.key_generation_service.grpc;

option java_multiple_files = true;
option java_package = "kz.astana.url_shortener.key_generation_service.grpc";
option java_outer_classname = "KeyGenerationProto";

service KeyGenerationGrpcService {
  rpc GetOneKey (GetOneKeyRequest) returns (GetOneKeyResponse);
}

message GetOneKeyRequest {
}

message GetOneKeyResponse {
  string key = 1;
}


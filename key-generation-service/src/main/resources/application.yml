spring:
  application:
    name: key-generation-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/key_generation_service
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

number-of-keys: ${NUMBER_OF_KEYS:100000}
number-of-keys-in-batch: ${NUMBER_OF_KEYS_IN_BATCH:1000}
number-of-keys-to-cache: ${NUMBER_OF_KEYS_TO_CACHE:10}